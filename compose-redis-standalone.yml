services:
  redis-master:
    image: redis:8.2.4-alpine3.22
    container_name: redis-master
    command: 
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - SandiMasterRedis
      - --masterauth
      - SandiMasterRedis
      - --maxmemory
      - 1536mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 1g  
    ports:
      - 6389:6379
    volumes:
      - redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    restart: always
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "SandiMasterRedis", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5


  conductor:
    #image: conductoross/conductor:latest
    image: conductoross/conductor:latest
    container_name: conductor
    env_file:
      - .env
    environment:
      - CONFIG_PROP=config-redis2.properties
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false -Xms1G -Xmx3G -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      # - QUARKUS_HTTP_ACCESS_LOG_ENABLED=false 
      # - ORACLE_USER=cdt
      # - ORACLE_PASSWORD="PasswordApp123@!#"
      # - ORACLE_URL=jdbc:oracle:thin:@//host.docker.internal:1521/XEPDB1
      
    volumes:
      - ./config/config-redis2.properties:/app/config/config-redis2.properties
      # - ./config/config-redis-cluster.properties:/app/config/config-redis-cluster-es8.properties
      # - ./config-sqlite.properties:/app/config/config-sqlite.properties
      #- ./config-postgres-es7.properties:/app/config/config-postgres-es7.properties
      # - ./tmp/conductor-file-storage-e2e:/tmp/conductor-file-storage-e2e
    stdin_open: true  # sama dengan -i (interactive)
    tty: true   
    networks:
      - internal
    ports:
      - 9090:8080
      - 5052:5000
      # - 9002:9002
    links:
      # - elasticsearch:es
      - redis-master:rs
    
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"  
    depends_on:  
      redis-master:
        condition: service_healthy
      # elasticsearch:
        # condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12    
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '4'
        reservations:
          memory: 2g
          cpus: '2'  

   
volumes:
  redis:
#   postgres:
  # elasticdata:

networks:
  internal:
    driver: bridge
