services:
  redis-master:
    image: redis:8.2.4-alpine3.22
    container_name: redis-master
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass SandiMasterRedis --masterauth SandiMasterRedis
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis:/data
    networks:
      - internal
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "SandiMasterRedis", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:8.2.4-alpine3.22
    container_name: redis-replica
    command: redis-server /usr/local/etc/redis/redis.conf --replicaof redis-master 6379 --masterauth SandiMasterRedis --requirepass SandiMasterRedis
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - internal
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "SandiMasterRedis", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel:
    image: redis:8.2.4-alpine3.22
    container_name: redis-sentinel
    command: >
      sh -c "mkdir -p /etc/redis &&
             echo 'port 26379' > /etc/redis/sentinel.conf &&
             echo 'sentinel monitor mymaster redis-master 6379 1' >> /etc/redis/sentinel.conf &&
             echo 'sentinel auth-pass mymaster SandiMasterRedis' >> /etc/redis/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/redis/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 10000' >> /etc/redis/sentinel.conf &&
             echo 'sentinel resolve-hostnames yes' >> /etc/redis/sentinel.conf &&
             echo 'sentinel announce-hostnames yes' >> /etc/redis/sentinel.conf &&
             redis-server /etc/redis/sentinel.conf --sentinel"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "26379:26379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "26379", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - 9200:9200
    networks:
      - internal
    volumes:
      - elasticdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 15s
      timeout: 5s
      retries: 10

  conductor:
    image: conductoross/conductor:latest
    container_name: conductor
    environment:
      - CONFIG_PROP=config-redis.properties
      - CONDUCTOR_DB_TYPE=redis_sentinel
      - CONDUCTOR_QUEUE_TYPE=redis_sentinel
      - CONDUCTOR_REDIS_SENTINEL_MASTER_NAME=mymaster
      - CONDUCTOR_REDIS_HOSTS=redis-sentinel:26379:us-east-1c:SandiMasterRedis
      # Redisson Distributed Lock (Sentinel Mode)
      - CONDUCTOR_REDIS_LOCK_SERVER_TYPE=SENTINEL
      - CONDUCTOR_REDIS_LOCK_SERVER_MASTER_NAME=mymaster
      - CONDUCTOR_REDIS_LOCK_SERVER_ADDRESS=redis://redis-sentinel:26379
      - CONDUCTOR_REDIS_LOCK_SERVER_PASSWORD=SandiMasterRedis
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false -Xms256M -Xmx2G
    volumes:
      - ./config-redis.properties:/app/config/config-redis.properties
      - ./config-es.properties:/app/config/config-es.properties
    stdin_open: true  # sama dengan -i (interactive)
    tty: true   
    networks:
      - internal
    ports:
      - 8080:8080
      - 5050:5000
      - 9001:9001
    depends_on:  
      redis-sentinel:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12    

  # conductor-ui:
  #   image: conductor-oss/conductor-ui:latest
  #   environment:
  #     - VITE_WF_SERVER=http://conductor:8080
  #   ports:
  #     - 9090:80
  #   networks:
  #     - internal
  #   depends_on:
  #     - conductor
   
volumes:
  redis:
  postgres:
  elasticdata:

networks:
  internal:
    driver: bridge
