# Database persistence, queue, lock, and indexing configuration for Oracle
conductor.db.type=oracle
conductor.queue.type=oracle
conductor.indexing.enabled=true
conductor.indexing.type=oracle
conductor.workflow-execution-lock.type=oracle
conductor.app.workflowExecutionLockEnabled=true
conductor.app.lockTimeToTry=500
conductor.app.task-indexing-enabled=false
conductor.app.async-indexing-enabled=true
# Required to disable connecting to Elasticsearch
conductor.elasticsearch.version=0

# Oracle JDBC Connectivity
conductor.oracle.url=${ORACLE_URL:jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1}
conductor.oracle.username=${ORACLE_USER:conductor}
conductor.oracle.password=${ORACLE_PASSWORD:conductor}
conductor.oracle.schema=${ORACLE_SCHEMA:}
conductor.oracle.auto-init=true
conductor.oracle.max-pool-size=32
conductor.oracle.min-idle=4
conductor.oracle.connection-timeout-ms=30000
conductor.oracle.deadlock-retry-max=3
conductor.oracle.task-def-cache-refresh-interval=60s
conductor.oracle.async-max-pool-size=12
conductor.oracle.async-worker-queue-size=100

# Prometheus Metrics
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus

# Sample workflow
loadSample=false

# Task execution postpone duration
conductor.app.taskExecutionPostponeDuration=10s
