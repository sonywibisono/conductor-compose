# See README in the docker for configuration guide

# db.type determines the type of database used
# See various configurations below for the values
conductor.db.type=couchdb
conductor.queue.type=couchdb
conductor.couchdb.url=http://localhost:5984                                                                               
conductor.couchdb.username=admin                                                                                          
conductor.couchdb.password=8dHZPFLFGoPXuC 

conductor.redis.cluster.enabled=true
conductor.redis.hosts=${REDIS_HOSTS:-172.28.0.11:7001,172.28.0.12:7002,172.28.0.13:7003,172.28.0.14:7004,172.28.0.15:7005,172.28.0.16:7006}
conductor.redis.password=${REDIS_PASSWORD:-B1sm1ll4h2027!}
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.workflowNamespacePrefix=conductor
# --- Connection Pool Tuning (Sangat penting untuk throughput tinggi) ---                                                 
conductor.redis.maxConnectionsPerHost=50                                                                                 
conductor.redis.maxIdleConnections=64                                                                                     
conductor.redis.minIdleConnections=20                                                                                     
conductor.redis.maxTimeoutWhenExhausted=2000ms                                                                                                                                                                                                          
# --- In-Memory Caching ---                                                                                               
# Menghemat round-trip Redis untuk workflow definitions                                                                   
conductor.redis.workflowDefCacheEnabled=true                                                                              
conductor.redis.taskDefCacheRefreshInterval=60s                                                                           
conductor.redis.metadataCacheRefreshInterval=60s                                                                                                                                                                                                        
# --- Distributed Locking ---                                                                                             
conductor.redis-lock.server-type=CLUSTER      
conductor.redis-lock.serverType=CLUSTER
conductor.redis-lock.namespace=conductor
conductor.redis-lock.serverAddress=${LOCK_SERVER_ADDRESS:-redis://}
conductor.redis-lock.server-password=${REDIS_PASSWORD:-}
conductor.redis.cluster.maxAttempts=5                                                                                     
conductor.redis.cluster.timeout=2000                                                                                      
conductor.redis.cluster.maxTotal=128                                                                                      
conductor.redis.cluster.maxIdle=64                                                                                        
conductor.redis.cluster.minIdle=16                                                                      
conductor.workflow-execution-lock.type=redis    
conductor.app.workflowExecutionLockEnabled=true                                                                           
conductor.app.lockTimeToTry=500                                                                                           
conductor.app.lockLeaseTime=60000                                                                                         


conductor.indexing.enabled=true
conductor.indexing.type=elasticsearch8
conductor.elasticsearch.url=http://es:9200                                                                                        
conductor.elasticsearch.version=8
conductor.elasticsearch.indexName=conductor
conductor.elasticsearch.indexPrefix=conductor
conductor.elasticsearch.asyncMode=false
conductor.elasticsearch.batchSize=200
                                                                                                                              
    # Set 'yellow' jika single-node Elasticsearch di Docker, 'green' jika multi-node production                               
conductor.elasticsearch.clusterHealthColor=yellow                                                                         
conductor.elasticsearch.workflow.version=1
conductor.elasticsearch.task.version=
    # --- Bulk & Async Indexing Optimization ---                                                                              
conductor.elasticsearch.indexBatchSize=100                                                                                
conductor.elasticsearch.asyncWorkerQueueSize=500                                                                         
conductor.elasticsearch.asyncMaxPoolSize=24                                                                               
conductor.elasticsearch.asyncBufferFlushTimeout=5s                                                                        
conductor.elasticsearch.indexRefreshInterval=1s                                                                       
