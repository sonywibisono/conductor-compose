# Database persistence, queue, lock, and indexing configuration for Oracle
conductor.db.type=oracle
conductor.queue.type=redis_cluster
conductor.indexing.enabled=true
conductor.indexing.type=oracle
conductor.workflow-execution-lock.type=redis
conductor.app.workflowExecutionLockEnabled=true
conductor.app.lockTimeToTry=500
conductor.app.task-indexing-enabled=false
conductor.app.async-indexing-enabled=true
# Required to disable connecting to Elasticsearch
conductor.elasticsearch.version=8

# Oracle JDBC Connectivity
conductor.oracle.url=${ORACLE_URL:jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1}
conductor.oracle.username=${ORACLE_USER:conductor}
conductor.oracle.password=${ORACLE_PASSWORD:conductor}
conductor.oracle.schema=${ORACLE_SCHEMA:}
conductor.oracle.auto-init=true
conductor.oracle.max-pool-size=32
conductor.oracle.min-idle=4
conductor.oracle.connection-timeout-ms=30000
conductor.oracle.deadlock-retry-max=3
conductor.oracle.task-def-cache-refresh-interval=60s
conductor.oracle.async-max-pool-size=12
conductor.oracle.async-worker-queue-size=100
conductor.redis.cluster.enabled=true
conductor.redis.hosts=${REDIS_HOSTS:-172.28.0.11:7001,172.28.0.12:7002,172.28.0.13:7003,172.28.0.14:7004,172.28.0.15:7005,172.28.0.16:7006}
conductor.redis.password=${REDIS_PASSWORD:-B1sm1ll4h2027!}
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.workflowNamespacePrefix=conductor
# --- Connection Pool Tuning (Sangat penting untuk throughput tinggi) ---                                                 
conductor.redis.maxConnectionsPerHost=500                                                                                 
conductor.redis.maxIdleConnections=30                                                                                     
conductor.redis.minIdleConnections=10                                                                                     
conductor.redis.maxTimeoutWhenExhausted=3000ms                                                                                                                                                                                                          
# --- In-Memory Caching ---                                                                                               
# Menghemat round-trip Redis untuk workflow definitions                                                                   
conductor.redis.workflowDefCacheEnabled=true                                                                              
conductor.redis.taskDefCacheRefreshInterval=60s                                                                           
conductor.redis.metadataCacheRefreshInterval=60s                                                                                                                                                                                                        
# --- Distributed Locking ---                                                                                             
conductor.redis-lock.server-type=CLUSTER      
conductor.redis-lock.serverType=CLUSTER
conductor.redis-lock.namespace=conductor
conductor.redis-lock.serverAddress=${LOCK_SERVER_ADDRESS:-redis://}
conductor.redis-lock.server-password=${REDIS_PASSWORD:-}
conductor.redis.cluster.maxAttempts=5                                                                                     
conductor.redis.cluster.timeout=20000                                                                                      
conductor.redis.cluster.maxTotal=1000                                                                                      
conductor.redis.cluster.maxIdle=64                                                                                        
conductor.redis.cluster.minIdle=16   
conductor.indexing.type=elasticsearch8                                                                                    
conductor.elasticsearch.url=http://es:9200                                                                
conductor.elasticsearch.indexName=conductor
conductor.elasticsearch.indexPrefix=conductor
conductor.elasticsearch.asyncMode=true
conductor.elasticsearch.batchSize=500
                                                                                                                            
# Set 'yellow' jika single-node Elasticsearch di Docker, 'green' jika multi-node production                               
conductor.elasticsearch.clusterHealthColor=yellow                                                                         
conductor.elasticsearch.workflow.version=1
conductor.elasticsearch.task.version=
# --- Bulk & Async Indexing Optimization ---                                                                              
conductor.elasticsearch.indexBatchSize=500                                                                                
conductor.elasticsearch.asyncWorkerQueueSize=5000                                                                         
conductor.elasticsearch.asyncMaxPoolSize=32                                                                               
conductor.elasticsearch.asyncBufferFlushTimeout=5s                                                                        
conductor.elasticsearch.indexRefreshInterval=5s                                                                           
                                                                                                                            
# --- Index Template Settings ---                                                                                         
conductor.elasticsearch.indexShardCount=2                                                                                 
conductor.elasticsearch.indexReplicasCount=0                                                                              
        
# Prometheus Metrics
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus

# Sample workflow
loadSample=false

# Task execution postpone duration
conductor.app.taskExecutionPostponeDuration=10s
