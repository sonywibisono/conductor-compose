# Database persistence type.
# menggunakan postgres untuk menyimpan data workflow
conductor.db.type=sqlite

# conductor.external-payload-storage.type=postgres
# spring.datasource.db-kind=postgresql
# spring.datasource.username=postgres
# spring.datasource.password=sembarang
# # spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/conductors
# spring.datasource.hikari.maximum-pool-size=20
# # Below are the properties for redis
# # conductor.db.type=redis_sentinel
conductor.queue.type=redis_sentinel
# conductor.db.type=sqlite                                                                                             
# conductor.queue.type=sqlite                                                                                          
                                                                                                                        
# 2. DataSource JDBC SQLite (Spring Boot)                                                                            
spring.datasource.driver-class-name=org.sqlite.JDBC                                                                  
spring.datasource.url=jdbc:sqlite:/app/data/conductor.db?busy_timeout=15000&journal_mode=WAL                         
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update                                                                                           
# 3. Connection Pooling (HikariCP)                                                                                   
# SQLite bersifat file-based locking, sangat disarankan pool size kecil / 1 untuk menghindari database lock conflict 
#   saat write                                                                                                             
spring.datasource.hikari.maximum-pool-size=10                                                                         
                                                                                                                        
# 4. (Opsional) SQLite Tuning bawaan Conductor                                                                       
conductor.sqlite.deadlock-retry-max=3                                                                                
conductor.sqlite.task-def-cache-refresh-interval=60s                                                                 
                                                                                                                        
# 5. Indexing / Execution Search                                                                                     
# Jika Anda ingin indexing tersimpan di SQLite juga (tanpa Elasticsearch):                                           
# conductor.indexing.enabled=true                                                                                      
conductor.indexing.type=sqlite  
conductor.redis.hosts=rs:26379:us-east-1c:SandiMasterRedis
conductor.redis.sentinel-master-name=mymaster
conductor.redis.time-between-eviction-runs-millis=30000
conductor.redis.max-wait-millis=2000
conductor.redis-lock.server-type=SENTINEL
conductor.redis-lock.server-master-name=mymaster
conductor.redis-lock.server-address=redis://rs:26379
conductor.redis-lock.server-password=SandiMasterRedis

conductor.redis.taskDefCacheRefreshInterval=5
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
# For a single node dynomite or redis server, make sure the value below is set to same as rack specified in the "workflow.dynomite.cluster.hosts" property.
conductor.redis.availabilityZone=us-east-1c
conductor.redis.maxIdleConnections=128
conductor.redis.minIdleConnections=64
conductor.redis.minEvictableIdleTimeMillis = 1800000
conductor.redis.timeBetweenEvictionRunsMillis = -1L
conductor.redis.testWhileIdle = false
conductor.redis.numTestsPerEvictionRun = 3
conductor.redis.maxTimeoutWhenExhausted=2000ms
conductor.redis.workflowDefCacheEnabled=true


conductor.workflow-execution-lock.type=local_only
conductor.app.workflowExecutionLockEnabled=false
conductor.app.lockTimeToTry=500

conductor.app.systemTaskWorkerThreadCount=20
conductor.app.systemTaskMaxPollCount=20

# Elastic search instance indexing is enabled.
conductor.indexing.enabled=true
conductor.indexing.type=elasticsearch8
conductor.elasticsearch.url=http://es:9200
conductor.elasticsearch.version=8
conductor.elasticsearch.indexName=conductor
conductor.elasticsearch.clusterHealthColor=yellow
conductor.elasticsearch.indexRefreshInterval=1s

# Additional modules for metrics collection exposed to Prometheus (optional)
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# Redis health indicator
management.health.redis.enabled=true

# Load sample kitchen sink workflow
loadSample=false

# Redis cluster connection in SSL mode
conductor.redis.ssl=false

# File storage
conductor.file-storage.enabled=true
conductor.file-storage.type=conductor


