services:
  redis-master:
    image: redis:8.2.4-alpine3.22
    container_name: redis-master
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass SandiMasterRedis --masterauth SandiMasterRedis
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis:/data
    networks:
      - internal
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "SandiMasterRedis", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:8.2.4-alpine3.22
    container_name: redis-replica
    command: redis-server /usr/local/etc/redis/redis.conf --replicaof redis-master 6379 --masterauth SandiMasterRedis --requirepass SandiMasterRedis
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - internal
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "SandiMasterRedis", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel:
    image: redis:8.2.4-alpine3.22
    container_name: redis-sentinel
    command: >
      sh -c "mkdir -p /etc/redis &&
             echo 'port 26379' > /etc/redis/sentinel.conf &&
             echo 'sentinel monitor mymaster redis-master 6379 1' >> /etc/redis/sentinel.conf &&
             echo 'sentinel auth-pass mymaster SandiMasterRedis' >> /etc/redis/sentinel.conf &&
             echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/redis/sentinel.conf &&
             echo 'sentinel failover-timeout mymaster 10000' >> /etc/redis/sentinel.conf &&
             echo 'sentinel resolve-hostnames yes' >> /etc/redis/sentinel.conf &&
             echo 'sentinel announce-hostnames yes' >> /etc/redis/sentinel.conf &&
             redis-server /etc/redis/sentinel.conf --sentinel"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "26379:26379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "26379", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    # image: docker.elastic.co/elasticsearch/elasticsearch:8.19.11
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - 9200:9200
    networks:
      - internal
    volumes:
      - elasticdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 15s
      timeout: 5s
      retries: 10

  conductor:
    image: conductoross/conductor:latest
    # image: conductor:server
    container_name: conductor
    environment_file:
      - .env
    environment:
      - CONFIG_PROP=config-postgres-es7.properties
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false -Xms256M -Xmx1G
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - COHERE_API_KEY=${COHERE_API_KEY:-}
    volumes:
      # - ./config-redis.properties:/app/config/config-redis.properties
      # - ./config-es.properties:/app/config/config-es.properties
      # - ./config-sqlite.properties:/app/config/config-sqlite.properties
      - ./config-postgres-es7.properties:/app/config/config-postgres-es7.properties
      - ./tmp/conductor-file-storage-e2e:/tmp/conductor-file-storage-e2e
    stdin_open: true  # sama dengan -i (interactive)
    tty: true   
    networks:
      - internal
    ports:
      - 8080:8080
      - 5050:5000
      - 9001:9001
    links:
      - elasticsearch:es
      - redis-sentinel:rs
    
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"  
    depends_on:  
      redis-sentinel:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12    

   
volumes:
  redis:
  postgres:
  elasticdata:

networks:
  internal:
    driver: bridge
