services:
  redis-master:
    image: redis:8.2.4-alpine3.22
    container_name: redis-master
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass SandiMasterRedis --masterauth SandiMasterRedis
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - redis:/data
    networks:
      - internal
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "SandiMasterRedis", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.11
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.watermark.low=10gb                                                                
      - cluster.routing.allocation.disk.watermark.high=5gb                                                                
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    ports:
      - 9200:9200
    networks:
      - internal
    volumes:
      - elasticdata:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 15s
      timeout: 5s
      retries: 10

  conductor:
    image: conductoross/conductor:latest
    container_name: conductor
    environment:
      - CONFIG_PROP=config-redis.properties
      - CONDUCTOR_DB_TYPE=redis_standalone
      - CONDUCTOR_QUEUE_TYPE=redis_standalone
      - CONDUCTOR_REDIS_HOSTS=redis-master:6379
      - CONDUCTOR_REDIS_PASSWORD=SandiMasterRedis
      # Redisson Distributed Lock (Standalone Mode)
      - CONDUCTOR_REDIS_LOCK_SERVER_TYPE=SINGLE
      - CONDUCTOR_REDIS_LOCK_SERVER_ADDRESS=redis://redis-master:6379
      - CONDUCTOR_REDIS_LOCK_SERVER_PASSWORD=SandiMasterRedis
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false -Xms256M -Xmx2G
    volumes:
      - ./config-redis.properties:/app/config/config-redis.properties
      - ./config-es.properties:/app/config/config-es.properties
    stdin_open: true  # sama dengan -i (interactive)
    tty: true   
    networks:
      - internal
    ports:
      - 8080:8080
      - 5050:5000
      - 9001:9001
    depends_on:  
      redis-master:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12    

   
volumes:
  redis:
  elasticdata:

networks:
  internal:
    driver: bridge
