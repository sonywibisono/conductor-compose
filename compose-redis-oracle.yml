services:
  
  conductor:
    #image: conductoross/conductor:latest
    image: conductor-oracle:latest
    container_name: conductor
    env_file:
      - .env
    environment:
      - CONFIG_PROP=config-oracle-redis.properties
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false -Xms1G -Xmx3G -XX:+UseG1GC -XX:MaxGCPauseMillis=100
      - QUARKUS_HTTP_ACCESS_LOG_ENABLED=false 
      - ORACLE_USER=cdt
      - ORACLE_PASSWORD="PasswordApp123@!#"
      - ORACLE_URL=jdbc:oracle:thin:@//host.docker.internal:1521/XEPDB1
      
    volumes:
      - ./config/config-oracle-redis.properties:/app/config/config-oracle-redis.properties
      # - ./config/config-redis-cluster.properties:/app/config/config-redis-cluster-es8.properties
      # - ./config-sqlite.properties:/app/config/config-sqlite.properties
      #- ./config-postgres-es7.properties:/app/config/config-postgres-es7.properties
      # - ./tmp/conductor-file-storage-e2e:/tmp/conductor-file-storage-e2e
    stdin_open: true  # sama dengan -i (interactive)
    tty: true   
    networks:
      - internal
    ports:
      - 8080:8080
      - 5050:5000
      - 9001:9001
    # links:
      # - elasticsearch:es
      # - redis-master:rs
    
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"  
    # depends_on:  
      # redis-master:
      #   condition: service_healthy
      # elasticsearch:
        # condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12    
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '4'
        reservations:
          memory: 2g
          cpus: '2'  

   
# volumes:
#   redis:
#   postgres:
  # elasticdata:

networks:
  internal:
    driver: bridge
