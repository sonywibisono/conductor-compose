# ==============================================================================                                          
    # NETWORK & CONNECTION                                                                                                    
    # ==============================================================================                                          
    bind 0.0.0.0                                                                                                              
    protected-mode no                                                                                                         
    port 6379                                                                                                                 
    tcp-backlog 2048                                                                                                          
    timeout 0                                                                                                                 
    tcp-keepalive 300                                                                                                         
    maxclients 10000                                                                                                          
                                                                                                                              
    # ==============================================================================                                          
    # SECURITY & AUTHENTICATION (Penting untuk Sentinel)                                                                      
    # Catatan: Nilai requirepass dan masterauth WAJIB sama di semua node                                                      
    # ==============================================================================                                          
    requirepass SandiMasterRedis                                                                                              
    masterauth SandiMasterRedis                                                                                               
                                                                                                                              
    # ==============================================================================                                          
    # MEMORY MANAGEMENT                                                                                                       
    # ==============================================================================                                          
    # Sesuaikan maxmemory dengan alokasi RAM container/host (misal: 2gb / 4gb)                                                
    maxmemory 2gb                                                                                                             
                                                                                                                              
    # PENTING untuk Conductor / Queue:                                                                                        
    # Gunakan 'noeviction' agar task/queue workflow tidak terhapus diam-diam saat RAM penuh.                                  
    maxmemory-policy noeviction                                                                                               
                                                                                                                              
    # Async deletion (agar Redis tidak lag/freeze saat menghapus key besar)                                                   
    lazyfree-lazy-eviction yes                                                                                                
    lazyfree-lazy-expire yes                                                                                                  
    lazyfree-lazy-server-del yes                                                                                              
    replica-lazy-flush yes                                                                                                    
                                                                                                                              
    # ==============================================================================                                          
    # REPLICATION & SENTINEL OPTIMIZATION                                                                                     
    # ==============================================================================                                          
    # Diskless sync: master langsung streaming RDB via socket tanpa nulis ke disk                                             
    repl-diskless-sync yes                                                                                                    
    repl-diskless-sync-delay 5                                                                                                
    repl-diskless-load on-empty-db                                                                                            
                                                                                                                              
    # Perbesar replication backlog (default 1MB terlalu kecil).                                                               
    # Mencegah FULL RESYNC saat terjadi network spike atau failover singkat.                                                  
    repl-backlog-size 64mb                                                                                                    
    repl-backlog-ttl 3600                                                                                                     
                                                                                                                              
    # Izinkan replica melayani read saat koneksi master terputus                                                              
    replica-serve-stale-data yes                                                                                              
    replica-read-only yes                                                                                                     
                                                                                                                              
    # Prioritas failover sentinel (default 100).                                                                              
    replica-priority 100                                                                                                      
                                                                                                                              
    # (Opsional) Proteksi Split-Brain / Data Loss saat network partition:                                                     
    # Master akan tolak write jika tidak ada minimal 1 replica yang aktif dalam 10 detik.                                     
    # Aktifkan jika konsistensi data Conductor diutamakan:                                                                    
    # min-replicas-to-write 1                                                                                                 
    # min-replicas-max-lag 10                                                                                                 
                                                                                                                              
    # ==============================================================================                                          
    # PERSISTENCE (RDB & AOF)                                                                                                 
    # ==============================================================================                                          
    # RDB Snapshot (Backup berkala)                                                                                           
    save 900 1                                                                                                                
    save 300 10                                                                                                               
    save 60 10000                                                                                                             
    stop-writes-on-bgsave-error yes                                                                                           
    rdbcompression yes                                                                                                        
    rdbchecksum yes                                                                                                           
    dbfilename dump.rdb                                                                                                       
    dir /data                                                                                                                 
                                                                                                                              
    # AOF (Append Only File)                                                                                                  
    # Jika workflow state tidak boleh hilang sama sekali, hidupkan AOF:                                                       
    appendonly yes                                                                                                                    
    appendfilename "appendonly.aof"                                                                                                            
    appendfsync everysec                                                                                                      
    no-appendfsync-on-rewrite yes                                                                                             
    auto-aof-rewrite-percentage 100                                                                                           
    auto-aof-rewrite-min-size 64mb                                                                                            
                                                                                                                              
    # ==============================================================================                                          
    # THREADED I/O (Redis 6+)                                                                                                 
    # ==============================================================================                                          
    # Naikkan throughput socket jika CPU memiliki 4 core atau lebih                                                           
    io-threads 4                                                                                                              
    io-threads-do-reads yes                                                                                                   
                                                                                                                              
    # ==============================================================================                                          
    # MONITORING & LATENCY                                                                                                    
    # ==============================================================================                                          
    slowlog-log-slower-than 10000                                                                                             
    slowlog-max-len 1024                                                                                                      
    latency-monitor-threshold 100  