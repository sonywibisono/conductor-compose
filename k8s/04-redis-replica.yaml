apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-replica
  namespace: conductor
  labels:
    app: redis-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-replica
  template:
    metadata:
      labels:
        app: redis-replica
    spec:
      initContainers:
        - name: wait-for-redis-master
          image: redis:8.2.4-alpine3.22
          command:
            - /bin/sh
            - -c
            - |
              until redis-cli -h redis-master -p 6379 -a SandiMasterRedis ping | grep -q PONG; do
                echo "Waiting for redis-master to be healthy..."
                sleep 2
              done
      containers:
        - name: redis-replica
          image: redis:8.2.4-alpine3.22
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
            - --replicaof
            - redis-master
            - "6379"
            - --masterauth
            - SandiMasterRedis
            - --requirepass
            - SandiMasterRedis
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: conductor
  labels:
    app: redis-replica
spec:
  type: ClusterIP
  selector:
    app: redis-replica
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: redis-alt
      port: 6380
      targetPort: 6379
