# ==========================================
# Netflix / Orkes Conductor Kubernetes Setup
# Identik dengan docker compose.yaml
# ==========================================

apiVersion: v1
kind: Namespace
metadata:
  name: conductor
---
# ConfigMap untuk redis.conf
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: conductor
data:
  redis.conf: |
    appendonly yes
---
# ConfigMap untuk config-redis.properties dan config-es.properties
apiVersion: v1
kind: ConfigMap
metadata:
  name: conductor-config
  namespace: conductor
data:
  config-redis.properties: |
    # Database persistence type & Queue for Redis Sentinel
    conductor.db.type=redis_sentinel
    conductor.queue.type=redis_sentinel
    conductor.task.poll.batch.size = 100
    conductor.task.poll.interval = 200ms
    task.executor.thread.count = 16
    workflow.executor.thread.count = 1000

    decider.thread.count = 500

    queue.process.delay = 100ms

    # Redis Sentinel Host and Master configuration
    conductor.redis.hosts=redis-sentinel:26379:us-east-1c:SandiMasterRedis
    conductor.redis.sentinel-master-name=mymaster

    # Redisson Lock Configuration for Sentinel
    conductor.redis-lock.server-type=SENTINEL
    conductor.redis-lock.server-master-name=mymaster
    conductor.redis-lock.server-address=redis://redis-sentinel:26379
    conductor.redis-lock.server-password=SandiMasterRedis

    conductor.redis.taskDefCacheRefreshInterval=1
    conductor.redis.workflowNamespacePrefix=conductor
    conductor.redis.queueNamespacePrefix=conductor_queues

    #conductor.workflow-execution-lock.type=redis
    #conductor.app.workflowExecutionLockEnabled=true
    conductor.workflow-execution-lock.type=noop_lock
    conductor.app.workflowExecutionLockEnabled=false
    conductor.workflow-repair-service.enabled=true
    conductor.app.workflow.name-validation.enabled=false
    queues.dynomite.threads=10
    conductor.redis.queuesNonQuorumPort=22122
    #conductor.app.lockTimeToTry=500

    #conductor.app.systemTaskWorkerThreadCount=20
    #conductor.app.systemTaskMaxPollCount=20

    # Elastic search instance indexing is enabled.
    conductor.indexing.enabled=false
    conductor.elasticsearch.url=http://elasticsearch:9200
    conductor.elasticsearch.indexName=conductor
    conductor.elasticsearch.version=7
    conductor.elasticsearch.password=123change...
    conductor.elasticsearch.clusterHealthColor=yellow

    # Default event queue type to listen on for wait task
    conductor.default-event-queue.type=sqs

    # Additional modules for metrics collection exposed to Prometheus (optional)
    conductor.metrics-prometheus.enabled=true
    management.endpoints.web.exposure.include=health,info,prometheus
    management.endpoint.health.show-details=always
    management.metrics.tags.application=${spring.application.name}

    # Redis health indicator
    # if still error then disable it
    #management.health.redis.enabled=true

    # Load sample kitchen sink workflow
    loadSample=false

    #disable datadog
    management.datadog.metrics.export.enabled=false
    conductor.grpc-server.enabled=true
    conductor.grpc-server.port=9001

  config-es.properties: |
    # Database persistence type & Queue for Redis Sentinel
    conductor.db.type=redis_sentinel
    conductor.queue.type=redis_sentinel
    conductor.task.poll.batch.size = 100
    conductor.task.poll.interval = 200ms
    task.executor.thread.count = 16
    workflow.executor.thread.count = 1000

    decider.thread.count = 500

    queue.process.delay = 100ms

    # Redis Sentinel Host and Master configuration
    conductor.redis.hosts=redis-sentinel:26379:us-east-1c:SandiMasterRedis
    conductor.redis.sentinel-master-name=mymaster

    # Redisson Lock Configuration for Sentinel
    conductor.redis-lock.server-type=SENTINEL
    conductor.redis-lock.server-master-name=mymaster
    conductor.redis-lock.server-address=redis://redis-sentinel:26379
    conductor.redis-lock.server-password=SandiMasterRedis

    conductor.redis.taskDefCacheRefreshInterval=1
    conductor.redis.workflowNamespacePrefix=conductor
    conductor.redis.queueNamespacePrefix=conductor_queues

    conductor.workflow-execution-lock.type=redis
    #conductor.app.workflowExecutionLockEnabled=true
    #conductor.workflow-execution-lock.type=noop_lock
    conductor.app.workflowExecutionLockEnabled=false
    conductor.workflow-repair-service.enabled=true
    conductor.app.workflow.name-validation.enabled=false
    queues.dynomite.threads=10
    conductor.redis.queuesNonQuorumPort=22122
    #conductor.app.lockTimeToTry=500

    #conductor.app.systemTaskWorkerThreadCount=20
    #conductor.app.systemTaskMaxPollCount=20

    # Elastic search instance indexing is enabled.
    conductor.indexing.enabled=true
    indexing.type=elasticsearch
    elasticsearch.url=http://elasticsearch:9200
    conductor.elasticsearch.indexName=conductor
    conductor.elasticsearch.version=7

    # Default event queue type to listen on for wait task
    conductor.default-event-queue.type=sqs

    # Additional modules for metrics collection exposed to Prometheus (optional)
    conductor.metrics-prometheus.enabled=true
    management.endpoints.web.exposure.include=health,info,prometheus
    management.endpoint.health.show-details=always
    management.metrics.tags.application=${spring.application.name}

    # Redis health indicator
    # if still error then disable it
    #management.health.redis.enabled=true

    # Load sample kitchen sink workflow
    loadSample=false

    #disable datadog
    management.datadog.metrics.export.enabled=false
    conductor.grpc-server.enabled=true
    conductor.grpc-server.port=9001
---
# Storage: PVC untuk Redis Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: conductor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Storage: PVC untuk Elasticsearch Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-pvc
  namespace: conductor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# ------------------------------------------
# Service & Deployment: redis-master
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master
  namespace: conductor
  labels:
    app: redis-master
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-master
  template:
    metadata:
      labels:
        app: redis-master
    spec:
      containers:
        - name: redis-master
          image: redis:8.2.4-alpine3.22
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
            - --requirepass
            - SandiMasterRedis
            - --masterauth
            - SandiMasterRedis
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: conductor
  labels:
    app: redis-master
spec:
  type: ClusterIP
  selector:
    app: redis-master
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# ------------------------------------------
# Service & Deployment: redis-replica
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-replica
  namespace: conductor
  labels:
    app: redis-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-replica
  template:
    metadata:
      labels:
        app: redis-replica
    spec:
      initContainers:
        - name: wait-for-redis-master
          image: redis:8.2.4-alpine3.22
          command:
            - /bin/sh
            - -c
            - |
              until redis-cli -h redis-master -p 6379 -a SandiMasterRedis ping | grep -q PONG; do
                echo "Waiting for redis-master to be healthy..."
                sleep 2
              done
      containers:
        - name: redis-replica
          image: redis:8.2.4-alpine3.22
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
            - --replicaof
            - redis-master
            - "6379"
            - --masterauth
            - SandiMasterRedis
            - --requirepass
            - SandiMasterRedis
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica
  namespace: conductor
  labels:
    app: redis-replica
spec:
  type: ClusterIP
  selector:
    app: redis-replica
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: redis-alt
      port: 6380
      targetPort: 6379
---
# ------------------------------------------
# Service & Deployment: redis-sentinel
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: conductor
  labels:
    app: redis-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      initContainers:
        - name: wait-for-redis-nodes
          image: redis:8.2.4-alpine3.22
          command:
            - /bin/sh
            - -c
            - |
              until redis-cli -h redis-master -p 6379 -a SandiMasterRedis ping | grep -q PONG; do
                echo "Waiting for redis-master..."
                sleep 2
              done
              until redis-cli -h redis-replica -p 6379 -a SandiMasterRedis ping | grep -q PONG; do
                echo "Waiting for redis-replica..."
                sleep 2
              done
      containers:
        - name: redis-sentinel
          image: redis:8.2.4-alpine3.22
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /etc/redis
              echo 'port 26379' > /etc/redis/sentinel.conf
              echo 'sentinel monitor mymaster redis-master 6379 1' >> /etc/redis/sentinel.conf
              echo 'sentinel auth-pass mymaster SandiMasterRedis' >> /etc/redis/sentinel.conf
              echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/redis/sentinel.conf
              echo 'sentinel failover-timeout mymaster 10000' >> /etc/redis/sentinel.conf
              echo 'sentinel resolve-hostnames yes' >> /etc/redis/sentinel.conf
              echo 'sentinel announce-hostnames yes' >> /etc/redis/sentinel.conf
              exec redis-server /etc/redis/sentinel.conf --sentinel
          ports:
            - containerPort: 26379
              name: sentinel
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -p
                - "26379"
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -p
                - "26379"
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: conductor
  labels:
    app: redis-sentinel
spec:
  type: ClusterIP
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
---
# ------------------------------------------
# Service & Deployment: elasticsearch
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: conductor
  labels:
    app: elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox:latest
          command:
            - sh
            - -c
            - chown -R 1000:1000 /usr/share/elasticsearch/data
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 9200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: conductor
  labels:
    app: elasticsearch
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
# ------------------------------------------
# Service & Deployment: conductor
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  namespace: conductor
  labels:
    app: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conductor
  template:
    metadata:
      labels:
        app: conductor
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for redis-sentinel..."
              until nc -z -w 2 redis-sentinel 26379; do
                sleep 2
              done
              echo "Waiting for elasticsearch..."
              until nc -z -w 2 elasticsearch 9200; do
                sleep 2
              done
              echo "Dependencies are ready!"
      containers:
        - name: conductor
          image: conductoross/conductor:latest
          stdin: true
          tty: true
          env:
            - name: CONFIG_PROP
              value: "config-redis.properties"
            - name: CONDUCTOR_DB_TYPE
              value: "redis_sentinel"
            - name: CONDUCTOR_QUEUE_TYPE
              value: "redis_sentinel"
            - name: CONDUCTOR_REDIS_SENTINEL_MASTER_NAME
              value: "mymaster"
            - name: CONDUCTOR_REDIS_HOSTS
              value: "redis-sentinel:26379:us-east-1c:SandiMasterRedis"
            - name: CONDUCTOR_REDIS_LOCK_SERVER_TYPE
              value: "SENTINEL"
            - name: CONDUCTOR_REDIS_LOCK_SERVER_MASTER_NAME
              value: "mymaster"
            - name: CONDUCTOR_REDIS_LOCK_SERVER_ADDRESS
              value: "redis://redis-sentinel:26379"
            - name: CONDUCTOR_REDIS_LOCK_SERVER_PASSWORD
              value: "SandiMasterRedis"
            - name: JAVA_OPTS
              value: "-Dpolyglot.engine.WarnInterpreterOnly=false -Xms256M -Xmx2G"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5000
              name: metrics
            - containerPort: 9001
              name: grpc
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 3Gi
              cpu: 2000m
          volumeMounts:
            - name: conductor-config
              mountPath: /app/config/config-redis.properties
              subPath: config-redis.properties
            - name: conductor-config
              mountPath: /app/config/config-es.properties
              subPath: config-es.properties
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: conductor-config
          configMap:
            name: conductor-config
---
apiVersion: v1
kind: Service
metadata:
  name: conductor
  namespace: conductor
  labels:
    app: conductor
spec:
  type: ClusterIP
  selector:
    app: conductor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: port-5050
      port: 5050
      targetPort: 5000
    - name: port-5000
      port: 5000
      targetPort: 5000
    - name: grpc
      port: 9001
      targetPort: 9001
---
# ------------------------------------------
# Service & Deployment: conductor-ui (Opsional)
# ------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor-ui
  namespace: conductor
  labels:
    app: conductor-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conductor-ui
  template:
    metadata:
      labels:
        app: conductor-ui
    spec:
      containers:
        - name: conductor-ui
          image: conductor-oss/conductor-ui:latest
          env:
            - name: VITE_WF_SERVER
              value: "http://conductor:8080"
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: conductor-ui
  namespace: conductor
  labels:
    app: conductor-ui
spec:
  type: ClusterIP
  selector:
    app: conductor-ui
  ports:
    - name: http
      port: 9090
      targetPort: 80
