apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master
  namespace: conductor
  labels:
    app: redis-master
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-master
  template:
    metadata:
      labels:
        app: redis-master
    spec:
      containers:
        - name: redis-master
          image: redis:8.2.4-alpine3.22
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
            - --requirepass
            - SandiMasterRedis
            - --masterauth
            - SandiMasterRedis
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - SandiMasterRedis
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: conductor
  labels:
    app: redis-master
spec:
  type: ClusterIP
  selector:
    app: redis-master
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
