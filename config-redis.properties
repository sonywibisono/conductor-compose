# Database persistence type & Queue for Redis Sentinel
conductor.db.type=redis_standalone
conductor.queue.type=redis_standalone
conductor.task.poll.batch.size = 200
conductor.task.poll.interval = 60ms
task.executor.thread.count = 64
workflow.executor.thread.count = 1000

decider.thread.count = 100

queue.process.delay = 60ms

# Redis Sentinel Host and Master configuration
conductor.redis.hosts=redis-master:6379:us-east-1c:SandiMasterRedis
conductor.redis.password=SandiMasterRedis
# conductor.redis.sentinel-master-name=mymaster

# Redisson Lock Configuration for Sentinel
conductor.redis-lock.server-type=SINGLE
conductor.redis.lock.namespace=conductor
# conductor.redis-lock.server-master-name=mymaster
conductor.redis-lock.server-address=redis://SandiMasterRedis@redis-master:6379
conductor.redis-lock.server-password=SandiMasterRedis

conductor.redis.taskDefCacheRefreshInterval=5
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues

# conductor.workflow-execution-lock.type=redis
# conductor.app.workflowExecutionLockEnabled=true
conductor.workflow-execution-lock.type=redis
conductor.app.workflowExecutionLockEnabled=true
conductor.workflow-repair-service.enabled=true
conductor.app.workflow.name-validation.enabled=false
queues.dynomite.threads=20
conductor.redis.queuesNonQuorumPort=22122
conductor.app.lockTimeToTry=500

conductor.app.systemTaskWorkerThreadCount=200
conductor.app.systemTaskMaxPollCount=200

# Elastic search instance indexing is enabled.
conductor.indexing.enabled=true
conductor.indexing.type=elasticsearch
conductor.elasticsearch.url=http://elasticsearch:9200
conductor.elasticsearch.version=8
conductor.elasticsearch.indexName=conductor
conductor.elasticsearch.clusterHealthColor=yellow
conductor.elasticsearch.indexRefreshInterval=1s
conductor.elasticsearch.indexBatchSize=100                                                                                
conductor.elasticsearch.asyncWorkerQueueSize=500                                                                         
conductor.elasticsearch.asyncMaxPoolSize=24                                                                               
conductor.elasticsearch.asyncBufferFlushTimeout=5s                                                                        
conductor.elasticsearch.indexRefreshInterval=1s                                                                        
#Default event queue type to listen on for wait task
conductor.default-event-queue.type=sqs

# Additional modules for metrics collection exposed to Prometheus (optional)
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# Redis health indicator
# if still error then disable it
management.health.redis.enabled=false

# Load sample kitchen sink workflow
loadSample=false

#disable datadog
management.datadog.metrics.export.enabled=false
conductor.grpc-server.enabled=true
conductor.grpc-server.port=9001
